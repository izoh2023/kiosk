<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Welcome - Internet Access</title>
        <link rel="stylesheet" href="styles.css">
        <script src="md5.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="layout">
                <div class="card">
                    <div class="voucher_card">
                        <div class="brand">
                            <div class="logo_name">
                                <div class="logo"></div>
                                <div class="hotspotName">$(identity)</div>
                            </div>
                        </div>
    
                        <div class="voucher">
                            <h3>Have a voucher?</h3>
                            <!-- voucher quick-login -->
                            <form action="$(link-login-only)" method="post" class="small form" style="width: 100%;">
                                <input type="hidden" name="dst" value="$(link-orig)">
                                <div class="form-row">
                                    <input name="username" class="input" placeholder="Voucher code" />
                                </div>
                                <div class="form-row">
                                    <input type="password" name="password" class="input" placeholder="Password (if needed)" />
                                </div>
                                <div style="display:flex;gap:8px; justify-content: center;">
                                    <button type="submit" class="btn">Login</button>
                                    <a href="$(link-status)" class="btn ghost">Status</a>
                                </div>
                            </form>
                        </div>
<!-- 
                        <div class="notice small">
                            Need help? Contact the attendant or call <strong></strong>
                        </div> -->

                    </div>
                </div>

                <div class="card">
                    <div class="package_card">
                        <h2 style="text-align: center;">Available Packages</h2>
                        <div id="packs" class="pack-grid small">
                            <!-- packages loaded by app.js -->
                            <div class="small">Loading packages…</div>
                        </div>

                    </div>
                </div>

            </div>

            <div class="footer">Connect responsibly • $(identity)</div>
        </div>

        <!-- Modal for payment -->
        <div id="modal" class="modal" >
            <div class="modal-card">
                <div style="display:flex; justify-content:space-between;align-items:center">
                    <h3 id="modal-title">Buy</h3>
                    <button class="modal-close small-link">
                        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="20" height="20" viewBox="0 0 24 24">
                            <path d="M 4.7070312 3.2929688 L 3.2929688 4.7070312 L 10.585938 12 L 3.2929688 19.292969 L 4.7070312 20.707031 L 12 13.414062 L 19.292969 20.707031 L 20.707031 19.292969 L 13.414062 12 L 20.707031 4.7070312 L 19.292969 3.2929688 L 12 10.585938 L 4.7070312 3.2929688 z"></path>
                        </svg>
                    </button>
                </div>
                <p id="modal-desc" class="small"></p>
                <div class="form-row">
                    <div><strong>Price:</strong> <span id="modal-price"></span></div>
                </div>

                <form id="pay-form">
                    <div class="form-row">
                        <label class="small">Phone number</label>
                        <input id="phone" class="input" name="phone" placeholder="+2547..." style="width: 100%;"/>
                    </div>
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                        <button type="submit" id="pay-submit" class="btn">Pay</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Voucher show -->
        <div id="voucher-card" class="modal" aria-hidden="true">
            <div class="modal-card center">
            <h3>Voucher</h3>
            <div class="code-box" id="voucher-code">—</div>
            <div class="small" style="margin-top:8px">Expires in: <span id="voucher-expiry">—</span></div>
            <div style="margin-top:12px">
                <a class="small-link" onclick="location.reload()">Back</a>
            </div>
            </div>
        </div>

    <script type="module" src="app.js"></script>
    </body>
</html>
