<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Connected</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
    <div class="card center" style="width:100%;padding:40px 24px">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:var(--accent)">&#10003;</div>
      <h2 style="margin:0 0 8px;font-size:1.3rem;font-weight:700">You're Connected</h2>
      <p class="small" style="margin:0 0 24px">Redirecting you now&hellip;</p>
      <a href="$(link-orig)" class="btn" style="width:100%">Continue browsing</a>
    </div>
  </div>

  <script type="module">
    import { admin_id, sellers_api } from './config.js';

    // Fires exactly once, the instant a real hotspot login succeeds — this
    // is what actually marks a voucher "redeemed" now, rather than relying
    // on sellers_management noticing nonzero uptime on some polling
    // interval (a short session could fall entirely between two polls and
    // jump straight from sold to expired, skipping redeemed). sendBeacon is
    // deliberately used instead of fetch: this page redirects away almost
    // immediately afterward, and a beacon is guaranteed to be delivered
    // even if the tab navigates before a normal fetch would have completed.
    try {
      const payload = JSON.stringify({ username: '$(username)', admin_account_id: admin_id });
      navigator.sendBeacon(
        `${sellers_api}/api/public/vouchers/redeemed`,
        new Blob([payload], { type: 'application/json' })
      );
    } catch (e) {
      // Never block the redirect below on this — the background sync in
      // sellers_management is still the fallback if the beacon is lost.
    }

    setTimeout(function() {
      try { window.open('$(link-orig)', '_self'); }
      catch(e) { window.location.href = '$(link-orig)'; }
    }, 1200);
  </script>
</body>
</html>
