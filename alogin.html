<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;

      min-height: 100vh;

      background-color: #f9f9f9;

    .container {

      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Connected</h2>
    <p>You are now online. Redirecting…</p>
  </div>

  <script>
    function go() { 
      try {
        window.open('$(link-orig)', '_self');
      } catch(e) {
        window.location.href = '$(link-orig)';
      }
    }
    setTimeout(go, 900);
  </script>
</body>
</html>
